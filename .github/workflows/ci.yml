name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Release build + all tests ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test (${{ matrix.build_type }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, RelWithDebInfo]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build g++-12

      - name: Configure
        run: |
          CXX=g++-12 cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_FLAGS="-mavx2"

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

  # ── ThreadSanitizer — concurrent SPSC and matching correctness ────────────
  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build g++-12

      - name: Configure (TSan)
        run: |
          CXX=g++-12 cmake -S . -B build-tsan \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTSAN=ON

      - name: Build
        run: cmake --build build-tsan --parallel $(nproc)

      - name: Test under TSan
        env:
          TSAN_OPTIONS: "halt_on_error=1 second_deadlock_stack=1"
        run: ctest --test-dir build-tsan --output-on-failure --timeout 180

  # ── AddressSanitizer ──────────────────────────────────────────────────────
  asan:
    name: AddressSanitizer
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build g++-12

      - name: Configure (ASan)
        run: |
          CXX=g++-12 cmake -S . -B build-asan \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DASAN=ON

      - name: Build
        run: cmake --build build-asan --parallel $(nproc)

      - name: Test under ASan
        env:
          ASAN_OPTIONS: "halt_on_error=1 detect_leaks=1"
        run: ctest --test-dir build-asan --output-on-failure --timeout 180

  # ── UndefinedBehaviorSanitizer ────────────────────────────────────────────
  ubsan:
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build g++-12

      - name: Configure (UBSan)
        run: |
          CXX=g++-12 cmake -S . -B build-ubsan \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DUBSAN=ON

      - name: Build
        run: cmake --build build-ubsan --parallel $(nproc)

      - name: Test under UBSan
        env:
          UBSAN_OPTIONS: "halt_on_error=1 print_stacktrace=1"
        run: ctest --test-dir build-ubsan --output-on-failure --timeout 180

  # ── Benchmark smoke ───────────────────────────────────────────────────────
  bench-smoke:
    name: Benchmark Smoke
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build g++-12

      - name: Configure & Build
        run: |
          CXX=g++-12 cmake -S . -B build-bench -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-mavx2"
          cmake --build build-bench --parallel $(nproc)

      - name: Throughput smoke (must exceed 1M msgs/sec in CI)
        run: |
          output=$(./build-bench/bench_throughput)
          echo "$output"
          rate=$(echo "$output" | grep "Throughput (out)" | grep -oP '[0-9]+\.[0-9]+')
          python3 -c "
          rate = float('$rate')
          assert rate > 1.0, f'Throughput regression: {rate:.2f} M/s < 1.0 M/s threshold'
          print(f'Throughput OK: {rate:.2f} M msgs/sec')
          "
  # ── Differential fuzzer, longer run ───────────────────────────────────────
  # ctest already runs the model-based test_conservation at 1M events across
  # 5 seeds (see CMakeLists.txt). This job runs one 10M-event pass and
  # reports wall-clock time + pass/fail explicitly, since that number is the
  # headline correctness claim in the README.
  conservation-long:
    name: Conservation (10M events)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build g++-12

      - name: Configure & Build
        run: |
          CXX=g++-12 cmake -S . -B build-cons -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-mavx2"
          cmake --build build-cons --target test_conservation --parallel $(nproc)

      - name: Run 10M-event differential test
        run: |
          start=$(date +%s)
          ./build-cons/test_conservation 0x5EED 10000000
          status=$?
          end=$(date +%s)
          echo "wall_clock_seconds=$((end - start))"
          exit $status

  readme-consistency:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_readme.py --check
